<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random color generator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="color_box">
        <div id="colors" class="colors">
            <div class="color1" id="color1"></div>
            <div class="color2" id="color2"></div>
            <div class="color3" id="color3"></div>
            <div class="color4" id="color4"></div>
            <div class="color5" id="color5"></div>
        </div>
        <button class="button" id="color_changer" onclick="changecolors()">Generate new colors</button>
    </div>
</body>
</html>
