<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Card Reference</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <img class="card_image" src="../assets/qr-code.png" alt="TAMUhack 2027 check-in QR code">
        <h1 class="card_title">TAMUhack 2027</h1>
        <p class="card_text">Present this QR code to the scanners. It's your entrance ticket for check-in, meals, and raffles.</p>
    </main>
</body>
</html>
